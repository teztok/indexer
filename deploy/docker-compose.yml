x-indexer: &indexer
  image: ghcr.io/teia-community/indexer:${INDEXER_TAG:?set INDEXER_TAG in .env}
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - ./data/:/usr/src/app/data/
  networks:
    - default
  depends_on:
    teztok_database:
      condition: service_healthy

services:
  # The mount is /var/lib/postgresql, not /var/lib/postgresql/data. From 18 the
  # image puts the cluster in a version-numbered subdirectory of that path, so
  # that pg_upgrade --link does not have to cross a mount boundary. Mounting the
  # old path makes 18 refuse to start.
  #
  # max_connections is raised well above the default 100. Each worker process
  # opens three pools, not one: the knex pool from knexfile, graphile-worker's
  # own pool in run(), and another from makeWorkerUtils(). That is 9-12
  # connections per container, so the default replica counts alone reach ~95
  # and workers start failing with "too many clients already". Hasura adds its
  # own pool on top, capped below.
  teztok_database:
    image: postgres:18
    restart: unless-stopped
    container_name: teztok_database
    env_file:
      - .env
    # The stock postgres defaults assume a far smaller machine than this runs
    # on: 128MB shared_buffers and 1GB max_wal_size make indexing database
    # bound long before the workers are. Sized here for a ~16GB host; scale
    # shared_buffers to roughly a quarter of RAM and effective_cache_size to
    # about three quarters.
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=12GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - wal_buffers=64MB
      - -c
      - max_wal_size=16GB
      - -c
      - checkpoint_timeout=1800
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
    volumes:
      - ./db/:/var/lib/postgresql/
    # Without this, depends_on only waits for the container to start, not for
    # postgres to accept connections, and every worker crash-loops on boot.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  teztok_ctrl:
    <<: *indexer

  teztok_event-producer:
    <<: *indexer
    command: npm run start-worker:event-producer
    depends_on:
      teztok_ctrl:
        condition: service_started
    deploy:
      replicas: 4

  teztok_fetch-metadata:
    <<: *indexer
    command: npm run start-worker:fetch-metadata
    depends_on:
      teztok_ctrl:
        condition: service_started
    deploy:
      replicas: 2

  teztok_rebuild-token:
    <<: *indexer
    command: npm run start-worker:rebuild-token
    depends_on:
      teztok_ctrl:
        condition: service_started
    deploy:
      replicas: 2

  teztok_warmup_thumbnailcache:
    <<: *indexer
    command: npm run start-teia-worker:teia-warmup-thumbnail
    depends_on:
      teztok_ctrl:
        condition: service_started

  # No ingress is configured here: the api is reachable only on the compose
  # network. Add a reverse proxy with an overlay file -- see
  # docker-compose.site.example.yml.
  teztok_hasura:
    image: hasura/graphql-engine:v2.51.4
    restart: unless-stopped
    depends_on:
      teztok_database:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - default

  # Built from deploy/backup. pg_dump must be at least the server version, so
  # this image tracks the postgres major above; bump them together. Dumps are
  # pg_dump custom format named <database>_<timestamp>.dump, matching what the
  # previous backup image produced, so old backups stay restorable.
  backup:
    image: ghcr.io/teia-community/indexer-backup:${INDEXER_TAG:?set INDEXER_TAG in .env}
    restart: unless-stopped
    depends_on:
      teztok_database:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 7
    networks:
      - default

  # One-shot: create the schema on an empty database, or bring a restored
  # database up to the current migration state.
  #   docker compose --profile init run --rm db_init
  #
  # Runs the knex migrations, then creates the teia plugin tables. The plugin
  # is always enabled in this fork, and its tables are not part of the
  # migrations, so both steps are needed for a usable database.
  #
  # The migrations are idempotent. The plugin step is not: on a database that
  # already has the tables it reports "failed to create tables" and exits 0,
  # which is expected after a restore.
  db_init:
    <<: *indexer
    profiles:
      - init
    restart: "no"
    command: >
      sh -c "node build/scripts/init-db.js &&
             node build/scripts/create-plugin-tables.js teia"

  # One-shot: tell hasura which tables to expose. Without this a new instance
  # has a working database but an empty api, since hasura tracks nothing by
  # default. Safe to re-run; replace_metadata is idempotent.
  #   docker compose --profile init run --rm hasura_init
  hasura_init:
    profiles:
      - init
    image: curlimages/curl:8.11.1
    restart: "no"
    depends_on:
      teztok_hasura:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./hasura/metadata.json:/metadata.json:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        printf '{"type":"replace_metadata","args":' > /tmp/body.json
        cat /metadata.json >> /tmp/body.json
        printf '}' >> /tmp/body.json
        echo "waiting for hasura..."
        until curl -sf -o /dev/null http://teztok_hasura:8080/healthz; do sleep 2; done
        echo "applying metadata..."
        # Deliberately not curl -f: on a rejection the body names the
        # offending object, and -f would discard it and report only exit 22.
        code=$$(curl -s -o /tmp/resp.json -w '%{http_code}' \
          -X POST http://teztok_hasura:8080/v1/metadata \
          -H "x-hasura-admin-secret: $$HASURA_GRAPHQL_ADMIN_SECRET" \
          -H 'content-type: application/json' \
          --data-binary @/tmp/body.json)
        cat /tmp/resp.json; echo
        if [ "$$code" != "200" ]; then
          echo "metadata apply failed with HTTP $$code" >&2
          echo "if it names graphile_worker.jobs, run db_init first: the" >&2
          echo "metadata tracks that table and db_init installs its schema." >&2
          exit 1
        fi

  # One-shot: restore from S3. No argument restores the newest backup; pass a
  # timestamp to pick one. Run db_init afterwards so the schema is current.
  #   docker compose --profile restore run --rm db_restore
  #   docker compose --profile restore run --rm db_restore restore 2026-11-04T00:08:30
  #
  # The object name is derived from POSTGRES_DATABASE, so this restores
  # <POSTGRES_DATABASE>_<timestamp>.dump back into that same database. Restoring
  # a dump into a differently named database is not supported.
  db_restore:
    image: ghcr.io/teia-community/indexer-backup:${INDEXER_TAG:?set INDEXER_TAG in .env}
    profiles:
      - restore
    restart: "no"
    depends_on:
      teztok_database:
        condition: service_healthy
    env_file:
      - .env
    command: ["restore"]
    networks:
      - default

networks:
  default:
