x-indexer: &indexer
  image: ghcr.io/teia-community/indexer:${INDEXER_TAG:?set INDEXER_TAG in .env}
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - ./data/:/usr/src/app/data/
  networks:
    - ipfs
    - default
  depends_on:
    - teztok_database

services:
  teztok_database:
    image: postgres:16
    restart: unless-stopped
    container_name: teztok_database
    env_file:
      - .env
    volumes:
      - ./db/:/var/lib/postgresql/data/

  teztok_ctrl:
    <<: *indexer

  teztok_event-producer:
    <<: *indexer
    command: npm run start-worker:event-producer
    depends_on:
      - teztok_ctrl
    deploy:
      replicas: 4

  teztok_fetch-metadata:
    <<: *indexer
    command: npm run start-worker:fetch-metadata
    depends_on:
      - teztok_ctrl
    deploy:
      replicas: 2

  teztok_rebuild-token:
    <<: *indexer
    command: npm run start-worker:rebuild-token
    depends_on:
      - teztok_ctrl
    deploy:
      replicas: 2

  teztok_warmup_thumbnailcache:
    <<: *indexer
    command: npm run start-teia-worker:teia-warmup-thumbnail
    depends_on:
      - teztok_ctrl

  teztok_hasura:
    image: hasura/graphql-engine:v2.37.0
    restart: unless-stopped
    depends_on:
      - teztok_database
    env_file:
      - .env
    networks:
      - web
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.teztok_hasura.rule=Host(`teztok.teia.rocks`, `teztok2.teia.rocks`, `teztok.teia.art`)"
      - "traefik.http.routers.teztok_hasura.tls=true"
      - "traefik.http.routers.teztok_hasura.tls.certresolver=cloudflare"
      - "traefik.http.routers.teztok_hasura.middlewares=hsts-headers@file"
      - "traefik.http.services.teztok_hasura.loadbalancer.server.port=8080"

      # hic.af router (rate limited)
      - "traefik.http.routers.teztok_hasura_hicaf.rule=Host(`teztok.teia.rocks`, `teztok2.teia.rocks`, `teztok.teia.art`) && (Headers(`X-Hicaf-Client`, `hic.af-web`) || Headers(`Origin`, `https://hic.af`)) && !Method(`OPTIONS`)"
      - "traefik.http.routers.teztok_hasura_hicaf.priority=100"
      - "traefik.http.routers.teztok_hasura_hicaf.tls=true"
      - "traefik.http.routers.teztok_hasura_hicaf.tls.certresolver=cloudflare"
      - "traefik.http.routers.teztok_hasura_hicaf.middlewares=hicaf-ratelimit,hsts-headers@file"
      - "traefik.http.routers.teztok_hasura_hicaf.service=teztok_hasura"

      # Rate limit: one shared bucket for all hic.af traffic
      - "traefik.http.middlewares.hicaf-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.hicaf-ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.hicaf-ratelimit.ratelimit.burst=30"
      - "traefik.http.middlewares.hicaf-ratelimit.ratelimit.sourcecriterion.requestheadername=X-Hicaf-Client"

  backup:
    image: eeshugerman/postgres-backup-s3:16
    restart: unless-stopped
    depends_on:
      - teztok_database
    env_file:
      - .env
    environment:
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 7
    networks:
      - default

  # One-shot: create the schema on an empty database, or bring a restored
  # database up to the current migration state. Idempotent.
  #   docker compose --profile init run --rm db_init
  db_init:
    <<: *indexer
    profiles:
      - init
    restart: "no"
    command: npm run init:db

  # One-shot: restore from S3. No argument restores the newest backup; pass a
  # timestamp to pick one. Run db_init afterwards so the schema is current.
  #   docker compose --profile restore run --rm db_restore
  #   docker compose --profile restore run --rm db_restore 2026-11-04T00:08:30
  db_restore:
    image: eeshugerman/postgres-backup-s3:16
    profiles:
      - restore
    restart: "no"
    depends_on:
      - teztok_database
    env_file:
      - .env
    environment:
      SCHEDULE: ''
    entrypoint:
      - sh
      - /restore.sh
    networks:
      - default

networks:
  ipfs:
    external: true
  web:
    external: true
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:201:121::/64
